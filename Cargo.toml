[package]
name = "selune"
version = "0.1.0"
edition = "2024"
authors = ["Charles Dong <chardon_cs@proton.me>"]
license = "MIT"
repository = "https://github.com/shuvarie/selune.git"
description = "LLM provider registry for Shuvarie"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.13", features = ["blocking", "json"] }

