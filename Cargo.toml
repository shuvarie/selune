[package]
name = "selune"
version = "0.5.1"
edition = "2024"
authors = ["Charles Dong <chardon_cs@proton.me>"]
license = "MIT"
repository = "https://github.com/shuvarie/selune.git"
description = "LLM provider registry for Shuvarie"

[dependencies]
chrono = "0.4"
holidays2 = { version = "0.2", default-features = false, features = ["country-CN", "country-US"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.13", features = ["blocking", "json"] }
chrono-tz = { version = "0.10", features = ["serde"] }

[workspace]
